<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>狼人殺終局判定器</title>
    <style>
        /* 狼人殺風格 CSS */
        body {
            background-color: #0b0c10; /* 極深色背景 */
            color: #c5c6c7;
            font-family: 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(31, 40, 51, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.2);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid #45a29e;
        }
        /* 狼人圖片樣式 */
        .wolf-header {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #66fcf1;
            margin-bottom: 20px;
            box-shadow: 0 0 15px #66fcf1;
        }
        h2 { color: #66fcf1; margin-bottom: 10px; }
        .rule-note { font-size: 0.85em; color: #45a29e; margin-bottom: 20px; }
        textarea {
            width: 100%;
            height: 120px;
            background: #0b0c10;
            color: #66fcf1;
            border: 1px solid #45a29e;
            padding: 12px;
            font-family: 'Courier New', monospace;
            border-radius: 8px;
            resize: none;
        }
        button {
            margin-top: 20px;
            padding: 12px 40px;
            background-color: #1f2833;
            color: #66fcf1;
            border: 2px solid #66fcf1;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #66fcf1;
            color: #0b0c10;
        }
        #result {
            margin-top: 25px;
            font-size: 1.8em;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .werewolf-win { color: #ff4d4d; text-shadow: 0 0 10px #ff0000; }
        .townsfolk-win { color: #66fcf1; text-shadow: 0 0 10px #00ffff; }
        .wrong-input { color: #f7b731; }
    </style>
</head>
<body>

<div class="container">
    <!-- 使用狼人示意圖 -->
    <img src="https://images.unsplash.com/photo-1550747528-cdb45925b3f7?auto=format&fit=crop&w=400&q=80" alt="Werewolf" class="wolf-header">
    
    <h2>狼人殺遊戲判定器</h2>
    <p class="rule-note">身分定義：-1 狼人 | 0 平民 | 1 神職 [1]</p>
    
    <textarea id="inputData" placeholder="請輸入遊戲數據（例如範例 1）：
6
0 1 0 1 -1 -1
1
5
3
0"></textarea>
    
    <br>
    <button onclick="judgeGame()">天黑請閉眼，執行判定</button>

    <div id="result">等待輸入...</div>
</div>

<script>
    function judgeGame() {
        const input = document.getElementById('inputData').value.trim();
        const tokens = input.split(/\s+/).map(Number);
        if (tokens.length < 2) return;

        let idx = 0;
        const N = tokens[idx++]; 
        const roles = [];
        for (let i = 0; i < N; i++) roles.push(tokens[idx++]);

        const eliminated = new Set();
        let isWrong = false;

        while (idx < tokens.length) {
            const target = tokens[idx++];
            if (target === 0) break;
            if (eliminated.has(target)) {
                isWrong = true;
                break;
            }
            eliminated.add(target);
        }

        const resultDiv = document.getElementById('result');
        if (isWrong) {
            resultDiv.innerText = "Wrong";
            resultDiv.className = "wrong-input";
        } else {
            let werewolfAlive = false;
            for (let i = 1; i <= N; i++) {
                if (roles[i - 1] === -1 && !eliminated.has(i)) {
                    werewolfAlive = true;
                    break;
                }
            }

            if (werewolfAlive) {
                resultDiv.innerText = "Werewolves";
                resultDiv.className = "werewolf-win";
            } else {
                resultDiv.innerText = "Townsfolk";
                resultDiv.className = "townsfolk-win";
            }
        }
    }
</script>

</body>
</html>
